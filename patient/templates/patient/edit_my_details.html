{% extends "base.html" %}

{% load crispy_forms_tags %}
{% load static %}
{% block content %}

<div class="container mb-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 d-flex justify-content-center my-4 my-md-3">
            <img id="user-icon" src="{% static 'images/nobody.jpg' %}" class="img-fluid me-3" alt="user icon">
            <p class="text-muted h6">Username: {{ user }}</p>
        </div>
    </div>
    <p class="h3 text-center mb-4">Edit My Details</p>
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 mb-5">
            <form method="POST">
                {% csrf_token %}
                <!-- Render user form -->
                {{ user_form|crispy }}
                <!-- Render patient form -->
                {{ patient_form|crispy }}
                <button type="submit" class="btn btn-warning mt-4">Update Details</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
