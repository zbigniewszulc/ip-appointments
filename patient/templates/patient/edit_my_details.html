{% extends "base.html" %}

{% load crispy_forms_tags %}
{% block content %}
<h2 class="text-center mb-4">Edit My Details</h2>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 mb-5">
            <p class="text-muted text-center h6 mb-4 ">Username: {{ user }}</p>
            <form method="POST">
                {% csrf_token %}
                <!-- Render user form -->
                {{ user_form|crispy }}
                <!-- Render patient form -->
                {{ patient_form|crispy }}
                <button type="submit" class="btn btn-warning mt-4">Update Details</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
